<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../lib/card.css">
<link rel="stylesheet" href="../lib/bundle.css">
<script>
  // Open overlays focus themselves; without this the showcase scrolls to the card.
  const focus = HTMLElement.prototype.focus;
  HTMLElement.prototype.focus = function (options) { focus.call(this, { ...options, preventScroll: true }); };
  if (window !== window.parent) Element.prototype.scrollIntoView = function () {};
</script>
<script src="../lib/react.production.min.js"></script>
<script src="../lib/react-dom.production.min.js"></script>
<script src="../lib/bundle.js"></script>
<title>DropdownMenu</title>
</head>
<body>
<div id="root" class="p-inset-lg font-sans text-foreground"></div>
<script>
(function () {
  var h = React.createElement
  var ns = window.Throughline
  with (ns) {
    ReactDOM.createRoot(document.getElementById('root')).render(h(DropdownMenu,{defaultOpen:true}, h(DropdownMenuTrigger,{className:buttonVariants({variant:'outline'})},'Project'), h(DropdownMenuContent,null, h(DropdownMenuGroup,null, h(DropdownMenuLabel,null,'Project'), h(DropdownMenuItem,null,'Rename'), h(DropdownMenuItem,null,'Duplicate', h(DropdownMenuShortcut,null,'⌘D'))), h(DropdownMenuSeparator,null), h(DropdownMenuItem,{variant:'destructive'},'Delete'))))
  }
  
})()
</script>

</body>
</html>
