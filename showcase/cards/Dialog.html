<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../lib/card.css">
<link rel="stylesheet" href="../lib/bundle.css">
<script>
  // Open overlays focus themselves; without this the showcase scrolls to the card.
  const focus = HTMLElement.prototype.focus;
  HTMLElement.prototype.focus = function (options) { focus.call(this, { ...options, preventScroll: true }); };
  if (window !== window.parent) Element.prototype.scrollIntoView = function () {};
</script>
<script src="../lib/react.production.min.js"></script>
<script src="../lib/react-dom.production.min.js"></script>
<script src="../lib/bundle.js"></script>
<title>Dialog</title>
</head>
<body>
<div id="root" class="p-inset-lg font-sans text-foreground"></div>
<script>
(function () {
  var h = React.createElement
  var ns = window.Throughline
  with (ns) {
    ReactDOM.createRoot(document.getElementById('root')).render(h(Dialog,{defaultOpen:true}, h(DialogTrigger,{className:buttonVariants({variant:'outline'})},'Delete project'), h(DialogContent,null, h(DialogHeader,null, h(DialogTitle,null,'Delete this project?'), h(DialogDescription,null,'Its files and history go too. This cannot be undone.')), h(DialogFooter,null, h(DialogClose,{className:buttonVariants({variant:'outline'})},'Cancel'), h(Button,{variant:'destructive'},'Delete')))))
  }
  
})()
</script>

</body>
</html>
