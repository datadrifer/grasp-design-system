<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../lib/card.css">
<link rel="stylesheet" href="../lib/bundle.css">
<script>
  // Open overlays focus themselves; without this the showcase scrolls to the card.
  const focus = HTMLElement.prototype.focus;
  HTMLElement.prototype.focus = function (options) { focus.call(this, { ...options, preventScroll: true }); };
  if (window !== window.parent) Element.prototype.scrollIntoView = function () {};
</script>
<script src="../lib/react.production.min.js"></script>
<script src="../lib/react-dom.production.min.js"></script>
<script src="../lib/bundle.js"></script>
<title>Sheet</title>
</head>
<body>
<div id="root" class="p-inset-lg font-sans text-foreground"></div>
<script>
(function () {
  var h = React.createElement
  var ns = window.Throughline
  with (ns) {
    ReactDOM.createRoot(document.getElementById('root')).render(h(Sheet,{defaultOpen:true}, h(SheetTrigger,{className:buttonVariants({variant:'outline'})},'Filters'), h(SheetContent,null, h(SheetHeader,null, h(SheetTitle,null,'Filters'), h(SheetDescription,null,'Narrow the list to what you need.')), h('div',{className:'grid gap-2 px-inset-md'}, h(Label,{htmlFor:'p-q'},'Search'), h(Input,{id:'p-q',placeholder:'Name or email'})), h(SheetFooter,null, h(Button,null,'Apply')))))
  }
  
})()
</script>

</body>
</html>
